<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelp Watch</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Yelp Watch</h1>
            <p class="subtitle">Monitor your favorite restaurant waitlists</p>
        </header>

        <!-- Add Restaurant Form -->
        <section class="card">
            <h2>Add Restaurant</h2>
            <form id="add-form">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Restaurant name" required>
                    <input type="url" id="url" placeholder="Yelp URL (e.g. https://www.yelp.com/biz/...)" required>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
                <div id="form-error" class="error"></div>
            </form>
        </section>

        <!-- Action Buttons -->
        <section class="card">
            <h2>Actions</h2>
            <button id="check-all" class="btn btn-secondary">📸 Check All Waitlists</button>
        </section>

        <!-- Restaurants List -->
        <section class="card">
            <h2>Your Watchlist</h2>
            <div id="restaurants" class="restaurant-list">
                <p class="empty-state">No restaurants yet. Add your first one above!</p>
            </div>
        </section>

        <!-- Screenshots Gallery -->
        <section class="card" id="gallery-section" style="display: none;">
            <h2>Screenshots <span id="gallery-count"></span></h2>
            <div id="screenshots" class="screenshot-grid">
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
